# The site is fully static: every page is built once per deploy from a fresh
# product snapshot, so there are no ISR reads or writes. Product data refreshes
# only when this is run by hand (Actions > Refresh product data > Run workflow),
# which triggers a production redeploy. Requires a Vercel Deploy Hook URL stored
# as the repository secret VERCEL_DEPLOY_HOOK_URL (Vercel: Settings > Git > Deploy Hooks).
name: Refresh product data

on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping." >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
